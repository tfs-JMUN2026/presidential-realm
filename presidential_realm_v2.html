<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presidential Realm — Strategy Edition</title>
<style>
:root{--bg:#0b1119;--panel:#141e2a;--panel2:#1b2938;--line:#304153;--gold:#d5ad65;--gold2:#f2d69b;--text:#e8edf3;--muted:#91a0b0;--green:#72c69b;--red:#d97878;--blue:#79aee0}
*{box-sizing:border-box}body{margin:0;background:#0b1119;color:var(--text);font:14px/1.4 Arial, sans-serif}button,select,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:76px 1fr}.rail{background:#080e15;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 7px;position:sticky;top:0;height:100vh}.crest{width:48px;height:48px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:25px;margin-bottom:12px;background:linear-gradient(145deg,#293b4c,#101923);clip-path:polygon(10% 0,90% 0,100% 15%,90% 85%,50% 100%,10% 85%,0 15%)}.navbtn{width:54px;height:49px;background:transparent;border:1px solid transparent;border-radius:7px;color:#9eacba;font-size:19px;position:relative}.navbtn:hover,.navbtn.active{background:#1c2b3b;border-color:#536274;color:var(--gold2)}.navbtn span{position:absolute;left:61px;top:13px;background:#0b1119;border:1px solid var(--line);padding:4px 8px;white-space:nowrap;display:none;z-index:10;font-size:11px}.navbtn:hover span{display:block}.main{min-width:0}.top{height:66px;background:#101923;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:15px;position:sticky;top:0;z-index:5}.brand{font-weight:bold;letter-spacing:1.6px;color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;font-weight:normal}.resources{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.res{background:#1a2735;border:1px solid #2d4052;padding:7px 10px;border-radius:5px;font-size:11px;color:var(--muted)}.res b{color:#f0d8a7;margin-left:5px}.top button,.btn{background:linear-gradient(#d9b873,#a98143);color:#17130d;border:1px solid #e0c27f;border-radius:4px;padding:9px 13px;font-weight:bold}.btn.alt{background:#26384a;color:#dce5ee;border:1px solid #496076}.btn.red{background:#512b32;color:#ffe3e3;border-color:#804b50}.view{padding:17px;max-width:1800px;margin:auto}.barline{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}.barline h1{font-size:18px;letter-spacing:1px;margin:0}.sub{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:13px}.mapframe{background:#111d29;border:1px solid #425367;box-shadow:0 10px 30px #0007;position:relative;overflow:hidden;min-height:500px}.maphead{display:flex;justify-content:space-between;padding:10px 13px;background:#1b2938;border-bottom:1px solid var(--line);font-size:11px;color:#c7d1dc}.maparea{position:relative;background:radial-gradient(ellipse at center,#253c4b 0,#142735 60%,#0d1b26 100%);height:430px;overflow:hidden}.maparea:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#a6c2c018 1px,transparent 1px),linear-gradient(90deg,#a6c2c018 1px,transparent 1px);background-size:48px 48px;opacity:.45}.worldsvg{position:absolute;width:100%;height:100%;inset:0}.land{fill:#526b68;stroke:#a3b8a9;stroke-width:1.2;cursor:pointer;transition:.15s}.land:hover,.land.sel{fill:#b28c50;stroke:#f2d59a;stroke-width:2.5}.sea-label{fill:#88a1ad;font-size:10px;letter-spacing:4px;opacity:.6}.mapcontrols{position:absolute;right:12px;top:12px;display:grid;gap:5px}.mapcontrols button{width:31px;height:31px;background:#101c29dd;color:#e3e9ef;border:1px solid #526579;border-radius:4px}.mapcaption{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:#152331;color:var(--muted);font-size:10px}.panel{background:#141f2b;border:1px solid #35485b;box-shadow:0 8px 24px #0005}.panelhead{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:bold;color:#e8d4a8;letter-spacing:.7px;font-size:12px}.panelbody{padding:13px}.nationflag{height:75px;background:linear-gradient(#a83b3b 0 33%,#eee 33% 66%,#355c8a 66%);border:1px solid #66798a;display:grid;place-items:center;font-size:26px;text-shadow:0 2px 5px #000}.nationname{font-size:18px;font-weight:bold;margin:10px 0 2px}.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3948;color:var(--muted);font-size:11px}.kv b{color:#e6edf4}.meter{height:6px;background:#304153;margin-top:5px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#a57e42,#e0c27d)}.actions{display:grid;gap:7px;margin-top:13px}.actions button{width:100%;text-align:left}.lower{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:13px;margin-top:13px}.smallpanel{background:#141f2b;border:1px solid #35485b;min-height:150px}.smallhead{padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:bold;color:#e6d3aa}.feed{padding:8px 12px}.feeditem{padding:7px 0;border-bottom:1px solid #283848;font-size:11px}.feeditem:last-child{border:0}.feeditem small{display:block;color:var(--muted);margin-top:2px}.pagegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:#162331;border:1px solid #35485b;padding:15px;min-height:120px}.tile h3{margin:0 0 7px;font-size:13px;color:#e9d5aa}.tile p{margin:0 0 12px;color:var(--muted);font-size:11px}.tile button{margin:3px 4px 0 0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #2a3a49}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.palace{height:390px;background:linear-gradient(#283d4d,#142230 62%,#111b25);border:1px solid #657382;position:relative;overflow:hidden;perspective:800px}.hall{position:absolute;inset:45px 8% 25px;background:linear-gradient(90deg,#172635 0 10%,#806844 10.5% 11%,#23394a 11.5% 88.5%,#806844 89% 89.5%,#172635 90%);border:5px solid #b18b51;box-shadow:inset 0 0 70px #000b;transform:rotateX(2deg)}.hall:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12%,#c9ad771c 12.5% 13%,transparent 13.5% 25%)}.hall:after{content:"";position:absolute;bottom:0;left:0;right:0;height:33%;background:linear-gradient(170deg,#70553a,#1c2935);clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%)}.door{position:absolute;z-index:2;bottom:24%;left:43%;width:14%;height:44%;border:4px solid #b58c4e;background:linear-gradient(90deg,#172332,#394c5d,#172332);clip-path:polygon(0 12%,50% 0,100% 12%,100% 100%,0 100%)}.furniture{position:absolute;z-index:3;bottom:17%;left:45%;font-size:42px}.halltitle{position:absolute;top:14px;width:100%;text-align:center;z-index:3;letter-spacing:5px;color:#ead5aa;font-size:11px}.roomcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.roomcard{background:#172635;border:1px solid #405365;padding:12px;cursor:pointer}.roomcard:hover{border-color:var(--gold)}.roomcard b{display:block;font-size:12px}.roomcard small{color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#000b;z-index:30;place-items:center;padding:15px}.modalbg.show{display:grid}.modal{width:min(500px,100%);background:#172534;border:1px solid #627487;padding:20px;box-shadow:0 20px 80px #000}.modal h2{margin:0 0 8px;color:#f0d9a9}.modal p{color:var(--muted);font-size:12px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;background:#0d1823;color:white;border:1px solid #45596b;border-radius:3px}.modalfoot{display:flex;gap:8px;margin-top:15px}.toast{position:fixed;bottom:16px;right:16px;background:#263d50;border:1px solid #71899b;padding:11px 15px;z-index:50;display:none}.toast.show{display:block}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.lower{grid-template-columns:1fr 1fr}.pagegrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{grid-template-columns:54px 1fr}.rail{padding:8px 3px}.navbtn{width:45px}.top{height:auto;min-height:65px;align-items:flex-start;flex-direction:column;padding:10px}.resources{justify-content:flex-start}.view{padding:9px}.maparea{height:320px}.lower,.pagegrid{grid-template-columns:1fr}.roomcards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="shell"><aside class="rail"><div class="crest">♜</div>
<button class="navbtn active" data-page="world">🌐<span>World</span></button><button class="navbtn" data-page="government">🏛<span>Government</span></button><button class="navbtn" data-page="economy">▤<span>Economy</span></button><button class="navbtn" data-page="diplomacy">🤝<span>Diplomacy</span></button><button class="navbtn" data-page="defence">⚑<span>Defence</span></button><button class="navbtn" data-page="research">⚗<span>Research</span></button><button class="navbtn" data-page="territories">⌖<span>Territories</span></button><button class="navbtn" data-page="parliament">▥<span>Parliament</span></button><button class="navbtn" data-page="palace">♜<span>Presidential Palace</span></button><button class="navbtn" data-page="documents">✒<span>Documents</span></button>
</aside><main class="main"><header class="top"><div class="brand">PRESIDENTIAL REALM<small>THE ART OF GOVERNANCE · STRATEGY EDITION</small></div><div class="resources"><div class="res">TREASURY <b id="money">$125.0B</b></div><div class="res">GDP <b id="gdp">$840B</b></div><div class="res">POPULATION <b id="pop">48.2M</b></div><div class="res">APPROVAL <b id="approval">64%</b></div><div class="res">TURN <b id="turn">01 · Q1 2026</b></div><button onclick="endTurn()">End Turn ▸</button></div></header><div class="view" id="view"></div></main></div>
<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(1)+'B';
let S=JSON.parse(localStorage.getItem('pr_strategy_save')||'null')||{treasury:125,gdp:840,pop:48.2,approval:64,turn:1,year:2026,q:1,selected:'Asteria',stability:72,tech:38,defence:61,food:74,energy:68,relations:{Asteria:82,Valoria:58,Dravik:42,Meridia:71,Orinth:49},log:[['New administration sworn in','The President begins the first term in the capital.']],ministers:[['Elena Voss','Foreign Affairs'],['Marcus Hale','Finance'],['Saira Nadeem','Interior']],governors:[],bills:[],signed:[],research:0};
const countries=[{n:'Asteria',x:390,y:160,d:'M330 130 L370 105 420 112 448 145 431 180 454 209 425 242 385 230 362 205 330 214 310 178Z',pop:'48.2M',gdp:'$840B',gov:'Presidential Republic',rel:82},{n:'Valoria',x:560,y:220,d:'M490 165 L540 140 585 157 612 190 598 230 620 262 584 290 540 270 510 245 475 225Z',pop:'72.5M',gdp:'$1.2T',gov:'Constitutional Republic',rel:58},{n:'Dravik',x:230,y:275,d:'M180 235 L220 210 260 224 285 260 270 300 295 335 255 355 215 330 185 300 160 270Z',pop:'31.8M',gdp:'$390B',gov:'Federal State',rel:42},{n:'Meridia',x:700,y:125,d:'M655 85 L705 65 750 88 770 125 750 162 772 185 735 210 692 192 670 155 635 130Z',pop:'56.1M',gdp:'$690B',gov:'Parliamentary Republic',rel:71},{n:'Orinth',x:770,y:315,d:'M710 260 L755 235 800 250 825 285 810 325 830 350 790 380 750 365 720 335 690 300Z',pop:'22.4M',gdp:'$270B',gov:'Kingdom',rel:49}];
function save(){localStorage.setItem('pr_strategy_save',JSON.stringify(S));updateTop()}function updateTop(){$('money').textContent=money(S.treasury);$('gdp').textContent=money(S.gdp);$('pop').textContent=S.pop.toFixed(1)+'M';$('approval').textContent=S.approval+'%';$('turn').textContent=String(S.turn).padStart(2,'0')+' · Q'+S.q+' '+S.year}
let page='world';function go(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function log(a,b){S.log.unshift([a,b]);S.log=S.log.slice(0,8)}
function countryPanel(){let c=countries.find(x=>x.n===S.selected)||countries[0];return `<div class="panel"><div class="panelhead">COUNTRY INTELLIGENCE</div><div class="panelbody"><div class="nationflag">✦</div><div class="nationname">${c.n}</div><div class="sub">${c.gov}</div><div class="kv"><span>Population</span><b>${c.pop}</b></div><div class="kv"><span>GDP</span><b>${c.gdp}</b></div><div class="kv"><span>Diplomatic ties</span><b>${c.rel}/100</b></div><div class="kv"><span>Government</span><b>${c.gov}</b></div><div class="actions"><button class="btn" onclick="act('diplomatic mission')">Send diplomatic mission</button><button class="btn alt" onclick="act('trade proposal')">Propose trade agreement</button><button class="btn alt" onclick="act('intelligence report')">Request country report</button></div></div></div>`}
function world(){return `<div class="barline"><div><div class="sub">WORLD AFFAIRS / STRATEGIC OVERVIEW</div><h1>WORLD MAP</h1></div><div class="sub">CAMPAIGN · REPUBLIC OF ASTERIA</div></div><div class="layout"><section class="mapframe"><div class="maphead"><b>WORLD POLITICAL MAP</b><span>SELECT A COUNTRY TO VIEW INTELLIGENCE</span></div><div class="maparea"><svg class="worldsvg" viewBox="0 0 900 430" preserveAspectRatio="xMidYMid meet"><text x="90" y="90" class="sea-label">NORTHERN OCEAN</text><text x="580" y="390" class="sea-label">SOUTHERN SEA</text>${countries.map(c=>`<path class="land ${S.selected===c.n?'sel':''}" data-c="${c.n}" d="${c.d}"><title>${c.n}</title></path><text x="${c.x}" y="${c.y}" fill="#e6ece6" font-size="12" text-anchor="middle" pointer-events="none">${c.n}</text>`).join('')}<path d="M448 170 Q470 185 490 200" stroke="#d7b46f" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="448" cy="170" r="5" fill="#e6c77e"/></svg><div class="mapcontrols"><button onclick="toast('Map zoomed in')">＋</button><button onclick="toast('Map zoomed out')">−</button><button onclick="S.selected='Asteria';render()">⌂</button></div></div><div class="mapcaption"><span>● Your nation: Asteria</span><span>● Selectable sovereign states</span><span>Map: fictional world</span></div></section>${countryPanel()}</div><div class="lower"><div class="smallpanel"><div class="smallhead">INTERNATIONAL NEWS</div><div class="feed">${S.log.slice(0,3).map(e=>`<div class="feeditem">${e[0]}<small>${e[1]}</small></div>`).join('')}</div></div><div class="smallpanel"><div class="smallhead">NATIONAL INDICATORS</div><div class="feed">${metric('Public approval',S.approval)}${metric('National stability',S.stability)}${metric('Technology index',S.tech)}</div></div><div class="smallpanel"><div class="smallhead">PRESIDENTIAL BRIEFING</div><div class="feed"><div class="feeditem">Cabinet meeting scheduled<small>Review the national agenda and ministry reports.</small></div><div class="feeditem">Quarterly economic outlook<small>Finance ministry briefing awaits your review.</small></div></div></div></div>`}
function metric(n,v){return `<div style="margin:8px 0;font-size:11px">${n}<b style="float:right">${v}%</b><div class="meter"><i style="width:${v}%"></i></div></div>`}
function cards(items){return `<div class="pagegrid">${items.map(x=>`<div class="tile"><h3>${x[0]}</h3><p>${x[1]}</p>${x[2]}</div>`).join('')}</div>`}
function btn(label,fn,alt=true){return `<button class="btn ${alt?'alt':''}" onclick="${fn}">${label}</button>`}
function government(){return `<div class="barline"><div><div class="sub">EXECUTIVE BRANCH</div><h1>GOVERNMENT & CABINET</h1></div>${btn('Appoint minister','appointMinister()',false)}</div><div class="panel"><div class="panelhead">PRESIDENTIAL CABINET</div><table class="table"><tr><th>Minister</th><th>Portfolio</th><th>Status</th></tr>${S.ministers.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td><span class="badge">In office</span></td></tr>`).join('')}</table></div><br>${cards([['Executive agenda','Set national priorities and coordinate ministries.',btn('Set national priority',"act('national priority')")],['Public administration','Review ministry performance and civil service capacity.',btn('Review administration',"act('administrative review')")],['Presidential address','Deliver a national address to the citizens.',btn('Deliver address',"act('presidential address')")]])}`}
function economy(){return `<div class="barline"><div><div class="sub">FINANCE & DEVELOPMENT</div><h1>NATIONAL ECONOMY</h1></div></div>${cards([['National Treasury',`Available funds: ${money(S.treasury)}.`,btn('Fund infrastructure','spend(8)',false)],['Industry & commerce','Support enterprise, employment and production.',btn('Business development','spend(9)')],['Healthcare','Expand public health capacity and access.',btn('Healthcare programme','spend(6)')],['Education','Invest in schools, universities and skills.',btn('Education programme','spend(7)')],['Energy','Improve national energy capacity.',btn('Energy programme','spend(8)')],['Food security','Support agriculture and strategic reserves.',btn('Food programme','spend(5)')]])}`}
function diplomacy(){return `<div class="barline"><div><div class="sub">FOREIGN OFFICE</div><h1>DIPLOMACY & TRADE</h1></div></div><div class="panel"><div class="panelhead">FOREIGN RELATIONS</div><table class="table"><tr><th>Country</th><th>Relations</th><th>Action</th></tr>${countries.filter(c=>c.n!=='Asteria').map(c=>`<tr><td>${c.n}</td><td>${c.rel}/100</td><td>${btn('Open dialogue',`diplomacyAct('${c.n}')`)}</td></tr>`).join('')}</table></div>`}
function defence(){return `<div class="barline"><div><div class="sub">NATIONAL SECURITY</div><h1>DEFENCE & RESILIENCE</h1></div></div>${cards([['Defence readiness',`National readiness index: ${S.defence}%.`,btn('Fund readiness review',"change('defence',3,8)")],['Civil protection','Emergency planning, disaster response and public resilience.',btn('Improve civil protection',"change('stability',3,5)")],['Veterans & personnel','Personnel welfare and administrative support.',btn('Personnel programme',"change('approval',2,4)")]])}`}
function research(){return `<div class="barline"><div><div class="sub">SCIENCE & INNOVATION</div><h1>RESEARCH & TECHNOLOGY</h1></div></div>${cards([['Technology index',`National technology level: ${S.tech}.`,btn('Fund research',"change('tech',4,7)",false)],['Universities','Support academic research and advanced skills.',btn('University grants',"change('tech',2,5)")],['Innovation programme','Encourage responsible research and new industries.',btn('Innovation grants',"change('gdp',12,9)")]])}`}
function territories(){return `<div class="barline"><div><div class="sub">REGIONAL ADMINISTRATION</div><h1>TERRITORIES & GOVERNORS</h1></div>${btn('Appoint administrator','appointGovernor()',false)}</div><div class="panel"><div class="panelhead">ADMINISTRATIVE REGISTER</div><table class="table"><tr><th>Territory</th><th>Administrator</th><th>Office</th></tr>${S.governors.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join('')||'<tr><td colspan="3">No regional administrators appointed yet.</td></tr>'}</table></div><br>${cards([['Overseas administration','Fictional territorial administration and local governance.',btn('Review territories',"act('territorial review')")],['Colonial administration','Historical-style governance mechanics for fictional campaign territories.',btn('Open administration',"act('colonial administration')")]])}`}
function parliament(){return `<div class="barline"><div><div class="sub">LEGISLATIVE BRANCH</div><h1>PARLIAMENT</h1></div>${btn('Introduce bill','newBill()',false)}</div><div class="panel"><div class="panelhead">LEGISLATIVE REGISTER</div><table class="table"><tr><th>Bill</th><th>Policy area</th><th>Status</th></tr>${S.bills.map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join('')||'<tr><td colspan="3">No bills before Parliament.</td></tr>'}</table></div><br>${btn('Hold parliamentary session','session()')}`}
function palace(){return `<div class="barline"><div><div class="sub">EXECUTIVE RESIDENCE</div><h1>PRESIDENTIAL PALACE</h1></div></div><div class="palace"><div class="hall"><div class="halltitle">PRESIDENTIAL PALACE · GRAND HALL</div><div class="door"></div><div class="furniture">♜</div></div></div><div class="roomcards">${['Grand Hall','President’s Office','Cabinet Chamber','Parliamentary Gallery','State Library','Diplomatic Reception'].map((n,i)=>`<div class="roomcard" onclick="room('${n}')"><b>${['🏛','✒','⚖','▤','📚','🤝'][i]} ${n}</b><small>Enter room · Interactions</small></div>`).join('')}</div><p class="sub">Palace environment is currently a stylised 2.5D prototype. Full navigable 3D is a later development milestone.</p>`}
function documents(){return `<div class="barline"><div><div class="sub">PRESIDENTIAL SECRETARIAT</div><h1>OFFICIAL DOCUMENTS</h1></div></div>${cards([['National Budget Act','Annual national budget and appropriations.',btn('Review & sign',"sign('National Budget Act')")],['Executive Order 001','Administrative order of the President.',btn('Review & sign',"sign('Executive Order 001')")],['Foreign Cooperation Treaty','Bilateral cooperation framework.',btn('Review & sign',"sign('Foreign Cooperation Treaty')")]])}`}
const renderers={world,government,economy,diplomacy,defence,research,territories,parliament,palace,documents};
function render(){$('view').innerHTML=renderers[page]();document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{S.selected=e.dataset.c;render()});updateTop()}
function act(a){log('Presidential decision',`The administration initiated: ${a}.`);save();render();toast('Decision recorded in the national chronicle.')}
function change(k,v,c){if(S.treasury<c){toast('Insufficient treasury funds.');return}S.treasury-=c;S[k]=Math.min(100,S[k]+v);log('Programme approved',`${k} improved following a national programme.`);save();render();toast('Programme approved.')}
function spend(c){change('gdp',3,c)}
function diplomacyAct(n){let c=countries.find(x=>x.n===n);if(S.treasury<2){toast('Insufficient funds.');return}S.treasury-=2;c.rel=Math.min(100,c.rel+5);S.relations[n]=c.rel;log('Diplomatic dialogue',`A diplomatic initiative improved relations with ${n}.`);save();render();toast('Relations improved.')}
function endTurn(){S.turn++;S.q++;if(S.q>4){S.q=1;S.year++}let income=3.5+S.gdp*.003;S.treasury+=income;S.gdp+=Math.random()*.8-.2;S.approval=Math.max(10,Math.min(99,S.approval+(Math.random()>.48?1:-1)));S.stability=Math.max(10,Math.min(99,S.stability+(Math.random()>.5?1:-1)));let events=[['Regional summit announced','Several governments have proposed a regional summit.'],['Economic report delivered','The Finance Ministry has submitted its quarterly outlook.'],['Public services review','Citizens are awaiting improvements to public services.'],['Scientific cooperation proposed','Universities have proposed a new research partnership.']];let e=events[Math.floor(Math.random()*events.length)];log(e[0],e[1]);save();render();toast('A new quarter has begun.')}
function modal(h){$('modal').innerHTML=h;$('modalbg').classList.add('show')}function closeModal(){$('modalbg').classList.remove('show')}
function appointMinister(){modal(`<h2>Cabinet appointment</h2><p>Nominate a minister to the executive cabinet.</p><div class="field"><label>Minister name</label><input id="mn"></div><div class="field"><label>Portfolio</label><select id="mr"><option>Foreign Affairs</option><option>Finance</option><option>Interior</option><option>Defence</option><option>Education</option><option>Health</option><option>Justice</option></select></div><div class="modalfoot"><button class="btn" onclick="S.ministers.push([$('mn').value,$('mr').value]);log('Cabinet appointment','A new minister joined the cabinet.');save();closeModal();render()">Appoint</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`)}
function appointGovernor(){modal(`<h2>Regional appointment</h2><p>Appoint a governor, governor-general or viceroy.</p><div class="field"><label>Territory</label><input id="gr"></div><div class="field"><label>Administrator</label><input id="gn"></div><div class="field"><label>Office</label><select id="gt"><option>Governor</option><option>Governor-General</option><option>Viceroy</option></select></div><div class="modalfoot"><button class="btn" onclick="if($('gr').value&&$('gn').value){S.governors.push([$('gr').value,$('gn').value,$('gt').value]);log('Regional appointment','A regional administrator was appointed.');save();closeModal();render()}else toast('Complete both names.')">Confirm</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`)}
function newBill(){modal(`<h2>Introduce legislation</h2><div class="field"><label>Bill title</label><input id="bn"></div><div class="field"><label>Policy area</label><select id="ba"><option>Economy</option><option>Education</option><option>Healthcare</option><option>Infrastructure</option><option>Governance</option></select></div><div class="modalfoot"><button class="btn" onclick="if($('bn').value){S.bills.push([$('bn').value,$('ba').value,'Introduced']);log('Bill introduced',$('bn').value+' entered Parliament.');save();closeModal();render()}else toast('Enter a bill title.')">Submit bill</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`)}
function session(){let n=0;S.bills.forEach(b=>{if(b[2]==='Introduced'){b[2]='Passed';n++}});S.approval=Math.min(99,S.approval+(n?2:0));log('Parliamentary session',n?`${n} bill(s) passed.`:'Parliament held a session; no bills were ready for a vote.');save();render();toast('Parliamentary session concluded.')}
function sign(n){if(S.signed.includes(n)){toast('Already signed.');return}modal(`<h2>${n}</h2><p>Presidential document awaiting signature.</p><p>Confirm that you approve this fictional in-game document.</p><div class="modalfoot"><button class="btn" onclick="S.signed.push('${n}');log('Document signed','${n} was signed by the President.');save();closeModal();render()">Sign document</button><button class="btn alt" onclick="closeModal()">Cancel</button></div>`)}
function room(n){modal(`<h2>${n}</h2><p>Presidential Palace · Room access</p><div class="palace" style="height:190px"><div class="hall"><div class="halltitle">${n.toUpperCase()}</div><div class="door"></div><div class="furniture">♜</div></div></div><p>Room interactions and detailed 3D navigation will be developed in a later milestone.</p><div class="modalfoot"><button class="btn alt" onclick="closeModal()">Leave room</button></div>`)}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
