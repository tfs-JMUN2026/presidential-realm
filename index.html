<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presidential Realm</title>
<style>
:root{--bg:#0a101b;--panel:#111c2b;--panel2:#172538;--line:#26384d;--gold:#d9b56d;--gold2:#f0d59a;--text:#e9eef5;--muted:#93a4b8;--green:#62c59a;--red:#e17d7d;--blue:#73a9e8;--shadow:0 14px 38px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#243b58 0,#0a101b 55%);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#0b1421;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px;padding:4px 9px 17px;border-bottom:1px solid var(--line)}.crest{width:42px;height:48px;border:1px solid var(--gold);border-radius:12px 12px 16px 16px;display:grid;place-items:center;color:var(--gold);font-size:23px;background:linear-gradient(145deg,#27364b,#101a29)}.brand b{display:block;letter-spacing:1.3px;font-size:13px}.brand small{color:var(--muted);font-size:10px;letter-spacing:2px}.navlabel{color:#70849b;font-size:10px;font-weight:800;letter-spacing:1.8px;padding:0 10px;margin:3px 0}.nav{display:grid;gap:4px}.nav button{border:0;color:#aebdce;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;transition:.15s}.nav button:hover{background:#172538;color:white}.nav button.active{background:linear-gradient(90deg,#24364b,#18283b);color:var(--gold2);box-shadow:inset 3px 0 var(--gold)}.ico{width:19px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 9px;color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0b1421a8;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800}.topbar h1{font-size:19px;margin:2px 0 0}.topright{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:#111d2b;border-radius:9px;padding:8px 11px;color:var(--muted);font-size:12px}.pill strong{color:var(--text)}.primary,.secondary,.danger{border:1px solid #8e754b;background:linear-gradient(135deg,#d6b16c,#a88449);color:#17140e;font-weight:800;border-radius:8px;padding:9px 13px;box-shadow:0 5px 14px #0003}.secondary{background:#1b2b40;border-color:#344b65;color:#dce7f3;box-shadow:none}.danger{background:#512b32;border-color:#81444c;color:#ffe0e0;box-shadow:none}.content{padding:25px 30px 45px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.pagehead h2{font-size:24px;margin:3px 0}.pagehead p{margin:0;color:var(--muted)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:17px}.card{background:linear-gradient(145deg,#152337,#101a28);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:#d9b56d0c;right:-20px;top:-20px}.stat label{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:24px;margin:7px 0 2px;letter-spacing:-.5px}.stat small{color:var(--green);font-size:11px}.two{grid-template-columns:1.55fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px}.sectiontitle h3{font-size:14px;margin:0}.muted{color:var(--muted)}.mapbox{background:#0d1a28;border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative}.mapbox svg{width:100%;height:auto;display:block;min-height:245px}.country{fill:#30465b;stroke:#8096aa;stroke-width:1.3;cursor:pointer;transition:.15s}.country:hover,.country.selected{fill:#b28d53;stroke:#f2d99e;stroke-width:2}.maplegend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding:11px 14px;border-top:1px solid var(--line)}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:5px;background:var(--gold)}.event{padding:12px 0;border-bottom:1px solid #26384d}.event:last-child{border:0}.event b{display:block;font-size:12px}.event small{color:var(--muted)}.event .tag{float:right;color:var(--gold);font-size:10px}.progress{height:7px;background:#26364a;border-radius:9px;overflow:hidden;margin:8px 0}.progress span{height:100%;display:block;background:linear-gradient(90deg,#a9844d,#e6c985);border-radius:9px}.rowline{display:flex;justify-content:space-between;gap:10px;align-items:center}.metric{margin:13px 0}.metric label{color:var(--muted);font-size:11px}.metric strong{font-size:12px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#8295aa;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #233247}.table tr:last-child td{border:0}.badge{padding:4px 7px;border-radius:5px;font-size:10px;background:#24374b;color:#b9cce0}.badge.good{background:#183b34;color:#83d7b5}.badge.warn{background:#453820;color:#e9c77e}.actions{display:flex;gap:8px;flex-wrap:wrap}.actioncard{padding:15px;border:1px solid var(--line);border-radius:10px;background:#101c2b}.actioncard h4{margin:0 0 5px;font-size:13px}.actioncard p{color:var(--muted);font-size:11px;min-height:33px;margin:0 0 12px}.actioncard button{width:100%}.roomgrid{grid-template-columns:repeat(3,1fr)}.room{border:1px solid var(--line);background:#101c2b;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}.room:hover{transform:translateY(-3px);border-color:#987b4d}.roomart{height:130px;position:relative;overflow:hidden;background:linear-gradient(150deg,#35465b,#17283a 55%,#0b1420)}.roomart:before{content:"";position:absolute;inset:15px 23px 0;border:2px solid #8d7857;transform:perspective(240px) rotateX(2deg);background:linear-gradient(90deg,#172638 0 22%,#2d3c4d 22% 24%,#1a2939 24% 76%,#2d3c4d 76% 78%,#172638 78%);box-shadow:inset 0 0 30px #0008}.roomart:after{content:"";position:absolute;left:38%;right:38%;bottom:0;height:55%;border:2px solid #b28c54;border-bottom:0;background:linear-gradient(90deg,#18283a,#354a60,#18283a);clip-path:polygon(0 10%,50% 0,100% 10%,100% 100%,0 100%)}.roomart .furniture{position:absolute;z-index:1;bottom:14px;left:42%;font-size:27px;filter:drop-shadow(0 4px 3px #0008)}.roominfo{padding:12px}.roominfo b{font-size:12px}.roominfo small{display:block;color:var(--muted);margin-top:3px}.modalback{position:fixed;inset:0;background:#050a11c9;z-index:20;display:none;place-items:center;padding:18px}.modalback.show{display:grid}.modal{width:min(540px,100%);background:#142235;border:1px solid #42536a;border-radius:15px;padding:22px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);margin:0 0 17px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;padding:11px;background:#0b1624;border:1px solid #34485f;color:white;border-radius:7px}.toast{position:fixed;bottom:22px;right:22px;background:#20364a;border:1px solid #55718c;border-radius:9px;padding:12px 16px;box-shadow:var(--shadow);z-index:40;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.hidden{display:none!important}.palaceview{background:linear-gradient(160deg,#253b50,#111d2b);border:1px solid #526075;border-radius:14px;padding:24px;min-height:310px;perspective:900px}.palacehall{height:260px;position:relative;transform-style:preserve-3d;background:linear-gradient(90deg,#18283a 0 12%,#33475a 12% 14%,#1a2b3e 14% 86%,#33475a 86% 88%,#18283a 88%),linear-gradient(#34495e,#142235);border:3px solid #9b8054;box-shadow:inset 0 0 50px #0009;overflow:hidden}.palacehall:before{content:"";position:absolute;left:10%;right:10%;top:0;height:100%;background:repeating-linear-gradient(90deg,transparent 0 15%,#d0b27a18 15.5% 16%,transparent 16.5% 30%);border-left:2px solid #8c754f;border-right:2px solid #8c754f}.palacehall:after{content:"";position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(170deg,#574631,#1b2734);clip-path:polygon(0 40%,50% 0,100% 40%,100% 100%,0 100%)}.throne{position:absolute;z-index:2;bottom:29px;left:50%;transform:translateX(-50%);font-size:55px;text-shadow:0 5px 9px #000}.halllabel{position:absolute;z-index:3;top:15px;left:0;right:0;text-align:center;color:#e7d2a6;letter-spacing:5px;font-size:11px}.roomtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.notice{border-left:3px solid var(--gold);background:#1a2b3e;padding:12px;border-radius:0 8px 8px 0;color:#c6d3e1;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px}.mobilemenu{display:none}
@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.roomgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-260px;top:0;bottom:0;width:245px;transition:.2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobilemenu{display:inline-block}.topbar{padding:0 15px;height:66px}.topright .pill:nth-child(2){display:none}.content{padding:19px 14px 35px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}.roomgrid,.three{grid-template-columns:1fr}.pagehead{align-items:start;flex-direction:column}.pagehead h2{font-size:21px}.topbar h1{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="crest">♜</div><div><b>PRESIDENTIAL REALM</b><small>THE NATION BUILDER</small></div></div>
<div><div class="navlabel">GOVERNMENT</div><nav class="nav">
<button class="active" data-page="overview"><span class="ico">◈</span>National Overview</button><button data-page="world"><span class="ico">◎</span>World & Territories</button><button data-page="government"><span class="ico">♙</span>Government & Cabinet</button><button data-page="parliament"><span class="ico">▤</span>Parliament & Laws</button><button data-page="economy"><span class="ico">◫</span>Economy & Budget</button>
</nav></div><div><div class="navlabel">FOREIGN & NATIONAL</div><nav class="nav"><button data-page="diplomacy"><span class="ico">⇄</span>Diplomacy & Trade</button><button data-page="research"><span class="ico">⌘</span>Research & Technology</button><button data-page="defence"><span class="ico">⬡</span>National Defence</button><button data-page="governors"><span class="ico">⚑</span>Governors & Viceroys</button></nav></div><div><div class="navlabel">PRESIDENTIAL ESTATE</div><nav class="nav"><button data-page="palace"><span class="ico">♜</span>Presidential Palace</button><button data-page="documents"><span class="ico">✎</span>Official Documents</button></nav></div><div class="sidefoot">SINGLE-PLAYER CAMPAIGN<br><span id="saveStatus">● Local save enabled</span><br><br>Development Build 0.2</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="menuBtn">☰</button><div><div class="eyebrow">OFFICE OF THE PRESIDENT</div><h1 id="countryTitle">Republic of Asteria</h1></div></div><div class="topright"><div class="pill">📅 <strong id="dateTop">Year 1 · Q1</strong></div><div class="pill">Turn <strong id="turnTop">1</strong></div><button class="primary" id="endTurn">End Turn →</button></div></header>
<div class="content" id="content"></div></main></div>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const initial=()=>({country:'Republic of Asteria',leader:'President',turn:1,year:2026,quarter:1,treasury:125000,economy:68,approval:62,population:18.4,technology:24,stability:76,resources:72,food:84,energy:66,defence:58,relations:{Borealis:54,Cyrenia:42,Demeria:68,Estavia:35,Faloria:61},selected:'Borealis',ministers:[{name:'Elena Voss',role:'Prime Minister',loyalty:82},{name:'Marcus Hale',role:'Finance Minister',loyalty:76},{name:'Anika Sen',role:'Foreign Affairs',loyalty:88},{name:'David Orin',role:'Science & Technology',loyalty:71}],bills:[{name:'National Infrastructure Act',status:'Passed',effect:'Development'},{name:'Public Education Expansion',status:'In committee',effect:'Education'}],governors:[{region:'North Province',name:'Governor Mira Sol',type:'Governor',loyalty:81}],signed:[],research:'Civic Administration',researchProgress:35,buildings:[],log:[{title:'A new administration begins',desc:'The first cabinet meeting has been scheduled.',turn:1}],flags:{},parliament:58});
let S=load();function load(){try{return JSON.parse(localStorage.getItem('pr_campaign'))||initial()}catch(e){return initial()}}function save(){localStorage.setItem('pr_campaign',JSON.stringify(S));document.getElementById('saveStatus').textContent='● Saved on this device'}function money(n){return '₳'+Math.round(n).toLocaleString('en-US')}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
const pages={overview:'National Overview',world:'World & Territories',government:'Government & Cabinet',parliament:'Parliament & Laws',economy:'Economy & Budget',diplomacy:'Diplomacy & Trade',research:'Research & Technology',defence:'National Defence',governors:'Governors & Viceroys',palace:'Presidential Palace',documents:'Official Documents'};let page='overview';
function header(){document.getElementById('countryTitle').textContent=S.country;document.getElementById('dateTop').textContent=`${S.year} · Q${S.quarter}`;document.getElementById('turnTop').textContent=S.turn}
function stats(){return `<div class="grid stats">${[['Treasury',money(S.treasury),'Available funds'],['Public approval',S.approval+'%','National confidence'],['Economy',S.economy+'/100','Economic strength'],['Population',S.population.toFixed(1)+'M','Estimated citizens'],['Stability',S.stability+'%','National stability']].map(x=>`<div class="card stat"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function mapSvg(){return `<div class="mapbox"><svg viewBox="0 0 760 340" role="img" aria-label="Fictional world map"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#24384b" stroke-width=".7"/></pattern></defs><rect width="760" height="340" fill="#0d1d2b"/><rect width="760" height="340" fill="url(#grid)"/><g opacity=".22" fill="#31556a"><path d="M0 30Q160 0 270 50T520 45T760 30V0H0Z"/><path d="M0 300Q170 260 330 310T760 280V340H0Z"/></g><g id="mapCountries"><path class="country ${S.selected==='Borealis'?'selected':''}" data-country="Borealis" d="M70 78l50-38 83 14 36 49-25 56-67 17-69-29-25-39z"/><path class="country ${S.selected==='Cyrenia'?'selected':''}" data-country="Cyrenia" d="M250 68l88-22 72 31 14 58-52 42-79-14-45-42z"/><path class="country ${S.selected==='Demeria'?'selected':''}" data-country="Demeria" d="M170 190l60-28 88 16 30 57-42 65-93-8-58-48z"/><path class="country ${S.selected==='Estavia'?'selected':''}" data-country="Estavia" d="M430 72l82-35 94 32 28 63-54 45-96-13-50-42z"/><path class="country ${S.selected==='Faloria'?'selected':''}" data-country="Faloria" d="M465 205l74-38 92 21 38 64-57 55-93-12-55-43z"/></g><g fill="#e7d3a9" font-size="12" text-anchor="middle" pointer-events="none"><text x="145" y="112">BOREALIS</text><text x="330" y="104">CYRENIA</text><text x="260" y="237">DEMERIA</text><text x="540" y="105">ESTAVIA</text><text x="580" y="252">FALORIA</text></g><g fill="#e1bd79"><circle cx="380" cy="184" r="5"/><circle cx="380" cy="184" r="12" fill="none" stroke="#e1bd79" opacity=".5"/></g><text x="380" y="208" text-anchor="middle" fill="#e8d6b5" font-size="10">ASTERIA · CAPITAL</text></svg><div class="maplegend"><span><i class="dot"></i>Independent nation</span><span>Click a country to inspect diplomatic relations</span></div></div>`}
function overview(){return `${stats()}<div class="grid two"><div class="card"><div class="sectiontitle"><h3>World Situation</h3><button class="secondary" onclick="go('world')">Open world map ↗</button></div>${mapSvg()}</div><div class="card"><div class="sectiontitle"><h3>National Indicators</h3><span class="badge good">Government active</span></div>${[['Economic health',S.economy],['Public approval',S.approval],['Political stability',S.stability],['Technology level',S.technology],['Resource security',S.resources]].map(m=>`<div class="metric"><div class="rowline"><label>${m[0]}</label><strong>${m[1]}/100</strong></div><div class="progress"><span style="width:${m[1]}%"></span></div></div>`).join('')}<div class="notice">Your decisions shape the country's economy, public confidence and standing abroad. Advance a turn to receive new developments.</div></div></div><div class="grid two" style="margin-top:15px"><div class="card"><div class="sectiontitle"><h3>Presidential Briefing</h3><span class="badge">Turn ${S.turn}</span></div>${S.log.slice(-4).reverse().map(e=>`<div class="event"><span class="tag">TURN ${e.turn}</span><b>${e.title}</b><small>${e.desc}</small></div>`).join('')}</div><div class="card"><div class="sectiontitle"><h3>Quick Decisions</h3></div><div class="grid three"><div class="actioncard"><h4>Invest in roads</h4><p>Improve infrastructure and long-term productivity.</p><button class="secondary" onclick="spend('roads')">Invest ₳8,000</button></div><div class="actioncard"><h4>Support hospitals</h4><p>Improve public services and confidence.</p><button class="secondary" onclick="spend('health')">Invest ₳6,000</button></div><div class="actioncard"><h4>Research grant</h4><p>Support national science programmes.</p><button class="secondary" onclick="spend('research')">Invest ₳7,000</button></div></div></div></div>`}
function world(){return `<div class="pagehead"><div><div class="eyebrow">INTERNATIONAL SYSTEM</div><h2>World & Territories</h2><p>Explore neighbouring states and review your international position.</p></div></div><div class="grid two"><div class="card">${mapSvg()}</div><div class="card"><div class="sectiontitle"><h3>Country dossier</h3><span class="badge">${S.selected}</span></div><p class="muted">${S.selected} is an independent state in the region. Diplomatic relations influence trade, cooperation and international stability.</p><div class="metric"><div class="rowline"><label>Diplomatic relations</label><strong>${S.relations[S.selected]}/100</strong></div><div class="progress"><span style="width:${S.relations[S.selected]}%"></span></div></div><div class="actions"><button class="secondary" onclick="relation('improve')">Send diplomatic mission</button><button class="secondary" onclick="relation('trade')">Propose trade pact</button><button class="secondary" onclick="relation('aid')">Offer development aid</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="font-size:13px">Regional nations</h3>${Object.entries(S.relations).map(([n,v])=>`<div class="event"><div class="rowline"><b>${n}</b><span class="badge ${v>60?'good':v<40?'warn':''}">${v}/100</span></div><div class="progress"><span style="width:${v}%"></span></div></div>`).join('')}</div></div><div class="card" style="margin-top:15px"><div class="sectiontitle"><h3>Territorial administration</h3><button class="secondary" onclick="go('governors')">Manage governors</button></div><p class="muted">Territories under your administration can be developed through governors and investment. Expansion and overseas administration are planned campaign systems; territorial claims are not yet active in this build.</p></div>`}
function government(){return `<div class="pagehead"><div><div class="eyebrow">EXECUTIVE BRANCH</div><h2>Government & Cabinet</h2><p>Manage your executive team and national priorities.</p></div><button class="primary" onclick="appointMinister()">＋ Appoint minister</button></div><div class="grid two"><div class="card"><div class="sectiontitle"><h3>Cabinet of Asteria</h3><span class="badge good">${S.ministers.length} appointed</span></div><table class="table"><thead><tr><th>Minister</th><th>Portfolio</th><th>Loyalty</th><th></th></tr></thead><tbody>${S.ministers.map((m,i)=>`<tr><td><b>${m.name}</b></td><td>${m.role}</td><td>${m.loyalty}%</td><td><button class="secondary" onclick="ministerBrief(${i})">Review</button></td></tr>`).join('')}</tbody></table></div><div class="card"><h3 style="margin-top:0">Government priorities</h3>${[['Economic growth','economy'],['Public services','approval'],['National stability','stability']].map(([n,k])=>`<div class="metric"><div class="rowline"><label>${n}</label><strong>${S[k]}/100</strong></div><div class="progress"><span style="width:${S[k]}%"></span></div></div>`).join('')}<div class="notice">Cabinet appointments and policy decisions affect the performance of your administration.</div></div></div>`}
function parliament(){return `<div class="pagehead"><div><div class="eyebrow">LEGISLATIVE BRANCH</div><h2>Parliament & Laws</h2><p>Introduce legislation, hold sessions and build parliamentary support.</p></div><button class="primary" onclick="newBill()">＋ Introduce bill</button></div><div class="grid two"><div class="card"><div class="sectiontitle"><h3>National Assembly</h3><span class="badge">Support ${S.parliament}%</span></div><div class="metric"><div class="rowline"><label>Government parliamentary support</label><strong>${S.parliament}%</strong></div><div class="progress"><span style="width:${S.parliament}%"></span></div></div><div class="notice">Bills with sufficient parliamentary support have a better chance of passing. Public approval and cabinet performance can influence support.</div><button class="secondary" style="margin-top:14px" onclick="session()">Hold parliamentary session</button></div><div class="card"><h3 style="margin-top:0">Legislative register</h3><table class="table"><thead><tr><th>Bill</th><th>Area</th><th>Status</th></tr></thead><tbody>${S.bills.map(b=>`<tr><td><b>${b.name}</b></td><td>${b.effect}</td><td><span class="badge ${b.status==='Passed'?'good':'warn'}">${b.status}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function economy(){return `<div class="pagehead"><div><div class="eyebrow">MINISTRY OF FINANCE</div><h2>Economy & Budget</h2><p>Allocate public funds to strengthen the national economy.</p></div></div>${stats()}<div class="grid three">${[['Transport infrastructure','roads','₳8,000','Improves productivity and economic strength.'],['Healthcare services','health','₳6,000','Supports public wellbeing and approval.'],['Business development','business','₳9,000','Encourages enterprise and economic activity.'],['Education programme','education','₳7,000','Builds human capital and public confidence.'],['Energy network','energy','₳8,000','Improves energy security and resilience.'],['Agriculture support','food','₳5,000','Strengthens food security and rural economy.']].map(([n,k,c,d])=>`<div class="actioncard"><h4>${n}</h4><p>${d}</p><div class="rowline" style="margin-bottom:10px"><small class="muted">Cost</small><b>${c}</b></div><button class="secondary" onclick="spend('${k}')">Fund programme</button></div>`).join('')}</div><div class="card" style="margin-top:15px"><h3 style="margin-top:0">National reserves</h3><div class="grid three">${[['Food security',S.food],['Energy security',S.energy],['Strategic resources',S.resources]].map(([n,v])=>`<div class="metric"><div class="rowline"><label>${n}</label><strong>${v}/100</strong></div><div class="progress"><span style="width:${v}%"></span></div></div>`).join('')}</div></div>`}
function diplomacy(){return `<div class="pagehead"><div><div class="eyebrow">MINISTRY OF FOREIGN AFFAIRS</div><h2>Diplomacy & Trade</h2><p>Build relationships through peaceful diplomacy and economic cooperation.</p></div></div><div class="grid two"><div class="card"><h3 style="margin-top:0">Diplomatic partners</h3><table class="table"><thead><tr><th>Nation</th><th>Relations</th><th>Standing</th></tr></thead><tbody>${Object.entries(S.relations).map(([n,v])=>`<tr><td><b>${n}</b></td><td>${v}/100</td><td><span class="badge ${v>60?'good':v<40?'warn':''}">${v>70?'Close':v>50?'Friendly':v>35?'Neutral':'Cool'}</span></td></tr>`).join('')}</tbody></table></div><div class="card"><h3 style="margin-top:0">Diplomatic initiatives</h3><div class="actioncard"><h4>Regional trade agreement</h4><p>Negotiate a peaceful trade framework with a selected partner.</p><button class="secondary" onclick="relation('trade')">Propose agreement</button></div><div class="actioncard" style="margin-top:10px"><h4>Diplomatic mission</h4><p>Open dialogue and improve bilateral relations.</p><button class="secondary" onclick="relation('improve')">Dispatch mission</button></div><div class="actioncard" style="margin-top:10px"><h4>Humanitarian cooperation</h4><p>Offer assistance during a regional challenge.</p><button class="secondary" onclick="relation('aid')">Offer cooperation</button></div></div></div>`}
function research(){return `<div class="pagehead"><div><div class="eyebrow">MINISTRY OF SCIENCE</div><h2>Research & Technology</h2><p>Invest in long-term knowledge, innovation and public capability.</p></div></div><div class="grid two"><div class="card"><div class="sectiontitle"><h3>Current research</h3><span class="badge warn">In progress</span></div><h2 style="font-size:21px;color:var(--gold2)">${S.research}</h2><p class="muted">Research progress contributes to the country's overall technology level.</p><div class="progress" style="height:12px"><span style="width:${S.researchProgress}%"></span></div><div class="rowline"><small class="muted">Progress</small><b>${S.researchProgress}%</b></div><button class="primary" style="margin-top:15px" onclick="fundResearch()">Fund research · ₳7,000</button></div><div class="card"><h3 style="margin-top:0">Research fields</h3>${[['Civic Administration','Governance and public systems'],['Renewable Energy','Cleaner energy and grid efficiency'],['Medical Innovation','Public health research'],['Digital Infrastructure','Digital public services'],['Agricultural Science','Crop resilience and food systems']].map(([a,b])=>`<div class="event"><b>${a}</b><small>${b}</small></div>`).join('')}</div></div>`}
function defence(){return `<div class="pagehead"><div><div class="eyebrow">NATIONAL SECURITY COUNCIL</div><h2>National Defence</h2><p>Oversee national resilience, preparedness and civilian protection.</p></div></div><div class="grid two"><div class="card"><h3 style="margin-top:0">National readiness</h3>${[['Defence readiness',S.defence],['Civil resilience',S.stability],['Emergency resources',S.resources]].map(([n,v])=>`<div class="metric"><div class="rowline"><label>${n}</label><strong>${v}/100</strong></div><div class="progress"><span style="width:${v}%"></span></div></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">Security policy</h3><div class="actioncard"><h4>Civil protection programme</h4><p>Improve emergency services, preparedness and community resilience.</p><button class="secondary" onclick="security('civil')">Fund programme · ₳6,000</button></div><div class="actioncard" style="margin-top:10px"><h4>Defence administration review</h4><p>Improve oversight, training standards and institutional readiness.</p><button class="secondary" onclick="security('review')">Commission review · ₳5,000</button></div><div class="notice" style="margin-top:12px">This game represents defence at a high-level policy and readiness scale, not real-world operational instructions.</div></div></div>`}
function governors(){return `<div class="pagehead"><div><div class="eyebrow">TERRITORIAL ADMINISTRATION</div><h2>Governors & Viceroys</h2><p>Appoint administrators to oversee provinces and territories.</p></div><button class="primary" onclick="appointGovernor()">＋ Appoint administrator</button></div><div class="card"><div class="sectiontitle"><h3>Provincial administration</h3><span class="badge">${S.governors.length} active</span></div><table class="table"><thead><tr><th>Province / Territory</th><th>Administrator</th><th>Office</th><th>Loyalty</th></tr></thead><tbody>${S.governors.map(g=>`<tr><td><b>${g.region}</b></td><td>${g.name}</td><td>${g.type}</td><td>${g.loyalty}%</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:15px">Governors manage regional development and report to the central government. Viceroy appointments are available for territories once the campaign's expansion system is introduced.</div></div>`}
function palace(){return `<div class="pagehead"><div><div class="eyebrow">THE EXECUTIVE RESIDENCE</div><h2>Presidential Palace</h2><p>Explore the presidential estate and enter its principal rooms.</p></div><span class="badge good">Residence open</span></div><div class="palaceview"><div class="palacehall"><div class="halllabel">PRESIDENTIAL PALACE · GRAND HALL</div><div class="throne">♜</div></div><div class="roomtools"><button class="secondary" onclick="toast('Grand Hall selected')">Enter Grand Hall</button><button class="secondary" onclick="toast('The palace tour is ready')">Begin palace tour</button></div></div><div class="grid roomgrid" style="margin-top:15px">${[['President’s Office','🖋️','Review briefings and sit at the presidential desk.'],['Cabinet Chamber','🏛️','Hold executive meetings with your ministers.'],['Parliament Hall','⚖️','Address representatives and open a session.'],['Diplomatic Reception','🤝','Receive foreign delegations.'],['War & Security Council','🛡️','Review national preparedness.'],['State Library','📚','Study policy and national records.']].map(([n,ic,d])=>`<div class="room" onclick="enterRoom('${n}')"><div class="roomart"><span class="furniture">${ic}</span></div><div class="roominfo"><b>${n}</b><small>${d}</small></div></div>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:12px">Palace rooms in this development build are illustrated interactive scenes. Fully navigable 3D rooms, character movement, sitting animations and detailed furniture interactions are planned for a later development stage.</p>`}
function documents(){return `<div class="pagehead"><div><div class="eyebrow">PRESIDENTIAL SECRETARIAT</div><h2>Official Documents</h2><p>Review and sign executive orders and official papers.</p></div></div><div class="grid two"><div class="card"><h3 style="margin-top:0">Pending signature</h3>${[['Executive Order 001','National Infrastructure Priority','Authorises the next phase of public infrastructure planning.'],['Presidential Directive 002','Digital Services Initiative','Directs ministries to coordinate digital public services.'],['Cabinet Resolution 003','Inter-Ministerial Coordination','Establishes a regular cabinet coordination schedule.']].map((d,i)=>`<div class="event"><span class="tag">DOCUMENT ${i+1}</span><b>${d[0]} · ${d[1]}</b><small>${d[2]}</small><div style="margin-top:9px"><button class="secondary" onclick="signDoc('${d[0]}')">✎ Review & sign</button></div></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">Signed register</h3>${S.signed.length?S.signed.map(d=>`<div class="event"><b>${d}</b><small>Signed by the President · Turn ${S.turn}</small></div>`).join(''):'<div class="empty">No documents signed yet.</div>'}</div></div>`}
const renderers={overview,world,government,parliament,economy,diplomacy,research,defence,governors,palace,documents};function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0)}function render(){header();document.getElementById('content').innerHTML=`${page!=='overview'&&page!=='world'&&page!=='economy'?`<div class="pagehead"><div><div class="eyebrow">PRESIDENTIAL REALM</div><h2>${pages[page]}</h2></div></div>`:''}${renderers[page]()}`;document.querySelectorAll('[data-country]').forEach(el=>el.addEventListener('click',()=>{S.selected=el.dataset.country;save();render()}))}
function addLog(title,desc){S.log.push({title,desc,turn:S.turn});if(S.log.length>30)S.log.shift()}function spend(kind){let cost={roads:8000,health:6000,research:7000,business:9000,education:7000,energy:8000,food:5000}[kind]||6000;if(S.treasury<cost){toast('Insufficient treasury funds.');return}S.treasury-=cost;let effects={roads:()=>{S.economy+=3;S.stability+=1},health:()=>{S.approval+=3;S.stability+=2},research:()=>{S.technology+=2;S.researchProgress+=8},business:()=>{S.economy+=4;S.approval+=1},education:()=>{S.approval+=2;S.technology+=1},energy:()=>{S.energy+=5;S.economy+=1},food:()=>{S.food+=6;S.approval+=1}};effects[kind]?.();clamp();addLog('Public investment approved',`${kind[0].toUpperCase()+kind.slice(1)} programme received ${money(cost)}.`);save();render();toast('Programme funded successfully.')}
function clamp(){['economy','approval','technology','stability','resources','food','energy','defence','parliament'].forEach(k=>S[k]=Math.max(0,Math.min(100,S[k])))}function relation(type){let n=S.selected,cost=type==='aid'?10000:type==='trade'?5000:2500;if(S.treasury<cost){toast('Insufficient treasury funds.');return}S.treasury-=cost;S.relations[n]=Math.min(100,S.relations[n]+(type==='aid'?12:type==='trade'?8:5));addLog('Diplomatic initiative',`${type==='aid'?'Development assistance offered to':type==='trade'?'Trade negotiations opened with':'Diplomatic mission dispatched to'} ${n}.`);save();render();toast('Diplomatic relations improved.')}
function fundResearch(){if(S.treasury<7000){toast('Insufficient treasury funds.');return}S.treasury-=7000;S.researchProgress+=20;if(S.researchProgress>=100){S.researchProgress-=100;S.technology+=5;S.research='Renewable Energy';addLog('Research milestone achieved','A national research programme reached a new milestone.')}clamp();save();render();toast('Research funding allocated.')}
function security(t){let c=t==='civil'?6000:5000;if(S.treasury<c){toast('Insufficient treasury funds.');return}S.treasury-=c;if(t==='civil'){S.stability+=4;S.approval+=1}else S.defence+=4;clamp();addLog('National security programme',t==='civil'?'Civil protection programme funded.':'Defence administration review commissioned.');save();render();toast('Policy approved.')}
function endTurn(){S.turn++;S.quarter++;if(S.quarter>4){S.quarter=1;S.year++}let income=12000+S.economy*120;S.treasury+=income;S.economy+=Math.random()>.48?1:-1;S.approval+=Math.random()>.55?1:-1;S.stability+=Math.random()>.6?1:-1;Object.keys(S.relations).forEach(n=>{if(Math.random()>.78)S.relations[n]=Math.max(0,Math.min(100,S.relations[n]+(Math.random()>.5?1:-1)))});let events=[['Economic outlook updated','The finance ministry has delivered its quarterly economic report.'],['Regional summit announced','Neighbouring governments have proposed a regional dialogue.'],['Public services review','The administration is reviewing the performance of public services.'],['Technology forum opens','Universities and industry representatives have met to discuss innovation.'],['Agricultural outlook','The agriculture ministry has reported on food supply and rural development.']];let e=events[Math.floor(Math.random()*events.length)];addLog(e[0],e[1]);clamp();save();render();toast(`Turn ${S.turn} begins. Treasury income: ${money(income)}.`)}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show')}function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function appointMinister(){modal(`<h2>Appoint a cabinet minister</h2><p>Select a portfolio and nominate a minister.</p><div class="field"><label>Minister's name</label><input id="mName" placeholder="Enter a name"></div><div class="field"><label>Portfolio</label><select id="mRole"><option>Interior Minister</option><option>Health Minister</option><option>Education Minister</option><option>Defence Minister</option><option>Agriculture Minister</option><option>Justice Minister</option><option>Transport Minister</option></select></div><div class="actions"><button class="primary" onclick="confirmMinister()">Confirm appointment</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}function confirmMinister(){let n=document.getElementById('mName').value.trim(),r=document.getElementById('mRole').value;if(!n){toast('Enter a minister name.');return}S.ministers.push({name:n,role:r,loyalty:70});addLog('Cabinet appointment',`${n} was appointed as ${r}.`);save();closeModal();render();toast('Minister appointed.')}
function ministerBrief(i){let m=S.ministers[i];modal(`<h2>${m.name}</h2><p>${m.role}</p><div class="metric"><div class="rowline"><label>Cabinet confidence</label><b>${m.loyalty}%</b></div><div class="progress"><span style="width:${m.loyalty}%"></span></div></div><div class="notice">This minister is part of your executive cabinet. Portfolio performance will be expanded in a later build.</div><div style="margin-top:15px"><button class="secondary" onclick="closeModal()">Close dossier</button></div>`)}
function newBill(){modal(`<h2>Introduce legislation</h2><p>Submit a proposal to the National Assembly.</p><div class="field"><label>Bill title</label><input id="bName" placeholder="e.g. Clean Energy Act"></div><div class="field"><label>Policy area</label><select id="bArea"><option>Economy</option><option>Education</option><option>Healthcare</option><option>Infrastructure</option><option>Environment</option><option>Governance</option></select></div><div class="actions"><button class="primary" onclick="confirmBill()">Submit bill</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}function confirmBill(){let n=document.getElementById('bName').value.trim(),a=document.getElementById('bArea').value;if(!n){toast('Enter a bill title.');return}S.bills.push({name:n,status:'In committee',effect:a});S.parliament=Math.max(0,S.parliament-1);addLog('Bill introduced',`${n} was introduced in Parliament.`);save();closeModal();render();toast('Bill submitted to Parliament.')}
function session(){let passed=0;S.bills.forEach(b=>{if(b.status==='In committee'&&S.parliament>=45){b.status='Passed';passed++}});S.parliament=Math.min(100,S.parliament+2);S.approval+=passed?2:0;clamp();addLog('Parliamentary session concluded',passed?`${passed} bill(s) passed after debate.`:'The Assembly held a session; no committee bills passed.');save();render();toast(passed?`${passed} bill(s) passed.`:'Session concluded.')}
function appointGovernor(){modal(`<h2>Appoint regional administrator</h2><p>Choose a province and appoint its administrator.</p><div class="field"><label>Province / territory</label><input id="gRegion" placeholder="Enter province name"></div><div class="field"><label>Administrator</label><input id="gName" placeholder="Enter administrator name"></div><div class="field"><label>Office</label><select id="gType"><option>Governor</option><option>Governor-General</option><option>Viceroy</option></select></div><div class="actions"><button class="primary" onclick="confirmGovernor()">Appoint</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}function confirmGovernor(){let r=document.getElementById('gRegion').value.trim(),n=document.getElementById('gName').value.trim(),t=document.getElementById('gType').value;if(!r||!n){toast('Complete both fields.');return}S.governors.push({region:r,name:n,type:t,loyalty:75});addLog('Regional appointment',`${n} appointed as ${t} of ${r}.`);save();closeModal();render();toast('Administrator appointed.')}
function enterRoom(n){modal(`<h2>${n}</h2><p>Presidential Palace · Interactive room</p><div class="palaceview" style="padding:12px;min-height:180px"><div class="palacehall" style="height:155px"><div class="halllabel">${n.toUpperCase()}</div><div class="throne">${n.includes('Office')?'🖋️':n.includes('Cabinet')?'🏛️':n.includes('Library')?'📚':'♜'}</div></div></div><div class="notice" style="margin-top:13px">Room access is available in this build. Detailed free-roam 3D movement and furniture interactions are planned for a later version.</div><div class="actions" style="margin-top:14px"><button class="secondary" onclick="toast('You are seated in the room.');closeModal()">Interact with room</button><button class="secondary" onclick="closeModal()">Leave room</button></div>`)}function signDoc(n){if(S.signed.includes(n)){toast('This document is already signed.');return}modal(`<h2>${n}</h2><p>Presidential document review</p><div class="notice">By signing, the President approves this document for the administration's official register. This is a fictional in-game action.</div><div class="actions" style="margin-top:16px"><button class="primary" onclick="confirmSign('${n}')">✎ Sign document</button><button class="secondary" onclick="closeModal()">Return</button></div>`)}function confirmSign(n){S.signed.push(n);addLog('Official document signed',`${n} was signed by the President.`);save();closeModal();render();toast('Document signed and registered.')}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('endTurn').addEventListener('click',endTurn);document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});render();
</script>
</body></html>
